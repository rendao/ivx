name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-coverage:
    name: Unit and Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]

      - name: Run unit tests with coverage reports
        run: |
          mkdir -p artifacts/ci
          pytest -m "not integration" \
            --override-ini addopts= \
            -q --maxfail=1 --disable-warnings \
            --junitxml=artifacts/ci/junit-unit.xml \
            --cov=src/ivx \
            --cov-report=xml:artifacts/ci/coverage.xml \
            --cov-report=term-missing

      - name: Upload unit test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-artifacts
          path: |
            artifacts/ci/junit-unit.xml
            artifacts/ci/coverage.xml
          if-no-files-found: warn

  lint:
    name: Lint Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8

      - name: Run flake8
        run: |
          flake8 src/ivx --count --select=E9,F63,F7,F82 --show-source --statistics

  integration:
    runs-on: ubuntu-latest
    needs: [unit-and-coverage, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]

      - name: Run integration tests
        run: |
          mkdir -p artifacts/ci
          pytest -m integration \
            --override-ini addopts= \
            -q --maxfail=1 --disable-warnings \
            --junitxml=artifacts/ci/junit-integration.xml

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-artifacts
          path: artifacts/ci/junit-integration.xml
          if-no-files-found: warn

  metrics-summary:
    name: Build Dashboard Metrics Summary
    runs-on: ubuntu-latest
    needs: [unit-and-coverage, integration]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download unit artifacts
        uses: actions/download-artifact@v4
        with:
          name: unit-coverage-artifacts
          path: artifacts/ci/input

      - name: Download integration artifacts
        uses: actions/download-artifact@v4
        with:
          name: integration-artifacts
          path: artifacts/ci/input

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate metrics summary JSON
        run: |
          python .github/scripts/build_metrics_summary.py \
            --input-dir artifacts/ci/input \
            --output artifacts/ci/output/metrics-summary.json

      - name: Upload dashboard metrics summary
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-ci-metrics
          path: artifacts/ci/output/metrics-summary.json
          if-no-files-found: error

      - name: Push metrics summary to dashboard (optional)
        run: |
          python .github/scripts/push_metrics_summary.py \
            --summary-file artifacts/ci/output/metrics-summary.json
