name: Weekly Multi-Project Trend

on:
  workflow_dispatch:
    inputs:
      samples:
        description: "Number of pilot samples"
        required: false
        default: "3"
      port_start:
        description: "Starting port for pilot runs"
        required: false
        default: "8900"
  schedule:
    - cron: "30 1 * * 1"

permissions:
  contents: read

concurrency:
  group: weekly-trend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  weekly-trend:
    name: Weekly Trend Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run weekly trend validation
        env:
          TREND_SAMPLES: ${{ github.event.inputs.samples || '3' }}
          TREND_PORT_START: ${{ github.event.inputs.port_start || '8900' }}
        run: |
          python scripts/workflow.py weekly-trend \
            --samples "$TREND_SAMPLES" \
            --port-start "$TREND_PORT_START" \
            --interval-seconds 0

      - name: Upload weekly trend artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-trend-artifacts
          path: |
            .ivx/data/multi-project-weekly-trend.json
            .ivx/data/multi-project-weekly-trend.md
          if-no-files-found: error
