name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Replace setup and install steps for your project stack.
      - name: Set up runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]

      - name: Run tests and generate reports
        run: |
          mkdir -p artifacts/ci
          pytest \
            --override-ini addopts= \
            -q --maxfail=1 --disable-warnings \
            --junitxml=artifacts/ci/junit.xml \
            --cov=src \
            --cov-report=xml:artifacts/ci/coverage.xml

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            artifacts/ci/junit.xml
            artifacts/ci/coverage.xml
          if-no-files-found: warn

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Replace with lint/type/security checks for your stack.
      - name: Run quality checks
        run: |
          echo "Add lint/type/security checks here"

  metrics-summary:
    name: Metrics Summary
    runs-on: ubuntu-latest
    needs: [test, quality]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-artifacts
          path: artifacts/ci/input

      - name: Build metrics summary JSON
        run: |
          # Replace with your own script that produces this contract file.
          mkdir -p artifacts/ci/output
          cat > artifacts/ci/output/metrics-summary.json << 'EOF'
          {
            "pipeline_metrics": {
              "testing": {
                "tests_passed": 0,
                "tests_failed": 0,
                "coverage_percent": 0,
                "regressions": 0
              },
              "ci": {
                "last_build_status": "success",
                "build_success_rate": 100
              }
            }
          }
          EOF

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-ci-metrics
          path: artifacts/ci/output/metrics-summary.json
          if-no-files-found: error

      - name: Push metrics to external dashboard (optional)
        run: |
          # Optional: use DASHBOARD_API_URL if present. Keep this step non-blocking when unset.
          echo "Add optional push script here"
